# Terry Gilliam (Monty Python) photo-montage cut-out. See the header of south_park.yaml for how to read this file.
style: gilliam
title: Terry Gilliam (Monty Python photo-montage)
cost_class: medium
cost_note: medium if the images are public domain; sourcing and cutting the photographs is the work

live:
  meta:
    fps: 25                  # PAL source; no step_hz: snap moves on ones
    default_easing: step            # "swift, sudden movements": a tween holds, then jumps
  environment:
    preset: default          # replace with an image plane (PlaneArt kind image) holding an engraving or photograph
  camera:
    default: hold            # measured: median global shift 0.03 px
    allowed: [hold]
  easing: [step, linear]     # "swift, sudden movements are much simpler"
  tween_duration_s: [0.12, 0.32]   # 3-8 frames at 25 fps
  motion_presets: [pop_in, slide_in, shake]   # an.motion; pop-ups, slides in from the edge
  shots:
    mean_s: 20               # the shot is the gag
    range_s: [8, 30]
  characters:
    generate: promote        # `an.characters.promote` from a hand-cut SVG; photographic parts, pinned joints
  transitions:
    default: {kind: cut}     # hard-cut snap timing

targets:
  one_frame_interval_share: [0.70, 0.85]   # measured 0.77
  mean_shot_s: [12, 30]                    # measured 20 (two long shots)

guidance:
  construction: limbs cut from photographs and engravings, joined at pins; lit from above
  sources: public-domain engravings and photographs only; check the licence of every image (an-dev-licensing)
  mouth: a hinged jaw piece (a rotation tween) or a swap set
  motion_vocabulary_unmapped: [drop, beheading, morph]   # no preset
  texture: photographic, many colours; flat fills read wrong
  text: period-type titles are text props with a period font FILE in `font`; hand-lettered signs are SVG prop art
  sound: absurd, dense SFX as shot `sounds` cues on each pop-up and squash; bring licensed or public-domain assets
  transitions: objects transform across the cut (a morph); not built — cut or dissolve
