# Kurzgesagt-style flat-vector explainer. See the header of south_park.yaml for how to read this file.
style: kurzgesagt
title: Kurzgesagt (flat-vector science explainer)
cost_class: very_high
cost_note: about 200 unique assets per 10-minute video; the cost is art volume, not engine

live:
  meta:
    fps: 30                  # smooth: no step_hz
  environment:
    # plane offsets and sizes are scene pixels from the stage centre at the default
    # 1920x1080; scale them with meta.resolution
    descriptor:              # an.environments.EnvironmentDescriptor; list order is draw order
      name: deep_field
      planes:
        - {name: field, art: {kind: fill, color: "#060e3d"}, depth: 0.0}
        - {name: far_stars, art: {kind: fill, color: "#291275"}, depth: 0.4, offset: [0, -60], size: [4000, 60]}
        - {name: near_stars, art: {kind: fill, color: "#5e2cb5"}, depth: 0.7, offset: [0, 80], size: [4000, 40]}
        - {name: foreground, art: {kind: fill, color: "#010210"}, depth: 1.3, offset: [0, 260], size: [6000, 200]}
      characters_after: near_stars
  camera:
    default: push_in         # continuous slow pushes and pulls
    allowed: [push_in, pull_out, pan_left, pan_right, tilt_up, tilt_down]
  easing: [ease_in_out, [0.34, 1.56, 0.64, 1.0]]   # the cubic-Bezier overshoots: pop-in with a bounce
  tween_duration_s: [0.4, 2.0]
  shots:
    mean_s: 7.5              # measured, median 6.3, n=8
    range_s: [3, 12]
  characters:
    generate: offline        # stand-ins; the real look needs hand-drawn birds and blobs (promote an SVG)

targets:
  identical_frame_share: [0.15, 0.30]   # measured 0.24: the picture is almost never still
  cuts_per_min: [6, 8]                  # measured 7.0
  mean_shot_s: [5.5, 9]                 # measured 7.5

guidance:
  construction: flat vector shapes, no outlines, soft gradients (gradients need SVG art, since plane fills are flat)
  characters: birds and blobs seen at a distance, not lip-synced; narration is voiceover
  ambient_motion: star twinkle, particles, glow pulses and drift under every shot; no ambient layer ships, so add looping tweens by hand
  palette_accents: {highlight: "#daf7ea", orange: "#d96739", sky_blue: "#5c9ec2"}   # not StylePack roles
  glow: an additive gradient sprite; no surface treatment ships
  dolly: depth-aware zoom is the real technique and is not built (an#110 deferred it); a zoom is uniform across planes
  text: rounded labels with coloured borders, diagrams with drawn-on lines; no text node ships
  sound: a calm single narrator, custom orchestral-ambient score, designed SFX; `an` renders dialogue audio only
  transitions: match-moves and flashes; `an` only hard-cuts
