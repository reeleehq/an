# Yuri Norstein multiplane (Hedgehog in the Fog). See the header of south_park.yaml for how to read this file.
style: norstein
title: Yuri Norstein (multiplane painted cut-out)
cost_class: very_high
cost_note: painted, textured art on every plane; the engine has the planes, the art is the cost

live:
  meta:
    fps: 25                  # no step_hz: a genuine mix of ones and twos
    default_easing: ease_in_out
  environment:
    # plane offsets and sizes are scene pixels from the stage centre at the default
    # 1920x1080; scale them with meta.resolution
    descriptor:              # glass planes about 25-30 cm apart; the depth ratio falls with distance from camera
      name: fog_glass
      planes:
        - {name: night_sky, art: {kind: fill, color: "#bfb7c3"}, depth: 0.3}
        - {name: far_trees, art: {kind: fill, color: "#807d83"}, depth: 0.6, offset: [0, 60], size: [5000, 260]}
        - {name: near_trees, art: {kind: fill, color: "#4a454d"}, depth: 0.85, offset: [0, 180], size: [5000, 200]}
        - {name: ground, art: {kind: fill, color: "#0d0d0d"}, depth: 1.0, offset: [0, 260], size: [6000, 160]}
        - {name: foreground_leaves, art: {kind: fill, color: "#0d0d0d"}, depth: 1.3, offset: [0, 320], size: [6000, 60]}
      characters_after: ground
  camera:
    default: pan_right       # slow drifts; pair depth-0 plates with pans, not push-ins (a zoom is uniform across planes)
    allowed: [pan_left, pan_right, push_in, pull_out, hold]
  easing: [ease_in_out]
  tween_duration_s: [1.0, 4.0]
  shots:
    mean_s: 8.6              # measured, median 5.5
    range_s: [4, 16]
  characters:
    generate: promote        # painted cel cut-outs with limbs separate
  transitions:
    default: {kind: dissolve, duration: 1.5}   # slow dissolves; the duration is an estimate
    fog_fade: {kind: fade, duration: 2.0, color: "#d8dde0"}   # a fade through fog grey, an estimate

targets:
  mean_saturation: [0.20, 0.30]   # measured 0.25
  dark_pixel_share: [0.55, 0.70]  # measured 0.63
  cuts_per_min: [4, 7]            # measured 6.0 (a floor: dissolves are not counted)

guidance:
  fog: thin tracing paper between planes, not a blur; planes have no alpha field, so a fog plane is a pale plane whose node you fade, which is untested here
  dolly: depth-aware zoom is the real technique and is not built (an#110 deferred it)
  edges: soft, without a blur filter; needs painted art
  expression: body angle, gaze and light; little or no lip-sync
  text: none
  sound: sparse, naturalistic ambience as a quiet looped `meta.sounds` cue plus occasional shot cues; bring licensed assets
