# OverSimplified-style history explainer. See the header of south_park.yaml for how to read this file.
style: oversimplified
title: OverSimplified (stick-figure history explainer)
cost_class: low_to_medium
cost_note: stick figures are cheap; sets, props, maps and crowds are many

live:
  meta:
    fps: 30
    default_easing: ease_out        # bursts that decelerate into a hold
    # no step_hz: motion is bursts on ones between holds (91% one-frame change gaps),
    # and step_hz would resample every tween onto one grid
  style_pack:
    name: oversimplified
    roles:
      sky: "#a7b1b9"         # measured grey
      ground: "#cda469"      # measured tan
  environment:
    preset: default
  camera:
    default: hold
    allowed: [hold, push_in, pan_left, pan_right]   # push-ins on still prints, pans over maps
  easing: [ease_out, linear]
  tween_duration_s: [0.13, 0.4]   # 4-12 frames, then a hold: burst-and-hold
  motion_presets: [pop_in, slide_in, slide_out, shake, turn]   # an.motion; `turn` for an about-face (to back) or a profile march (to side)
  shots:
    mean_s: 6.0              # measured, median 4.7, n=10
    range_s: [2, 12]
  characters:
    generate: offline
    mouth_variants: [happy, sad]
    build: stick             # `--build stick`: a small blocky body with stick limbs
    head_scale: 1.7          # `--head-scale 1.7`: the oversized head
    hat: [bicorne, bowler, cap, none]   # `--hat`: period headgear tells figures apart; worn above the brows, so expressions still read
    hair_style: [peak, bald, bun, curly]   # `--hair-style`: with the length, tells figures (and women from men) apart
    hair_length: [short, medium, long]     # `--hair-length`
    sash: true               # `--sash` on the figures that wear one (officers, royalty)
    palette: per_character   # `--palette clothing=#..,accessory=#..`: costume colour is identity
  transitions:
    default: {kind: cut}     # hard cuts plus gags
  sound:
    bed: {loop: true, gain_db: -8, duck_db: -12, fade_in: 1.0, fade_out: 1.5}   # a music bed ducked under the narrator; levels are an estimate
  voice:
    # Voice acting (an#209 keys, an#265 tempo and takes). Each role is a PARTIAL voice document:
    # merge it into the voice document of the character who plays the role, beside that voice's
    # own `voice_id` (looked up by name, never pasted), through
    # `an.audio.takes.style_voice_role(spec, role)`, which turns the target NAMES under `takes`
    # into the values in `prosody_targets` (a voice document holds numbers, never names).
    # eleven_v3 reads stability only as 0.0 / 0.5 / 1.0.
    # Cues go on the LINES as `{cue}` (`speaker {excited}: text`), per guidance.voice_acting; a
    # line's `[emotion]` is a face preset AND is sent as a tag too, so pick one that agrees with the cue.
    # `effects.tempo` re-times the synthesized line (pitch kept; eleven_v3 ignores `speed`): a ROLE
    # default for a voice speaking at v3's usual 4.9-5.4 syll/s - re-measure the cast voice and set
    # tempo = target median / its measured rate (guidance.voice_acting.tempo).
    # `takes` re-rolls a line N times and keeps the take that measures closest to its targets
    # (each take is a billed request; the render prints the cost before the first one).
    roles:
      narrator:  # Creative: the lively setups; {deadpan} still lands flat at 0.0. Punchlines are re-rolled.
        {provider: elevenlabs, model_id: eleven_v3, voice_settings: {stability: 0.0}, effects: {tempo: 1.1},
         takes: {n: 1, cues: {deadpan: {n: 3, targets: punchline}}}}
      eager:     # {excited} carries the jump; 0.5 keeps the same voice's wounded lines flat. The most variable voice: re-roll every line.
        {provider: elevenlabs, model_id: eleven_v3, voice_settings: {stability: 0.5},
         takes: {n: 3, targets: eager}}
      regal:     {provider: elevenlabs, model_id: eleven_v3, voice_settings: {stability: 0.5}}   # on target in one take
      deadpan:   # a character who is deadpan throughout (untested as a whole role; the narrator's punchline numbers apply)
        {provider: elevenlabs, model_id: eleven_v3, voice_settings: {stability: 0.5}, takes: {n: 2, targets: deadpan}}
      serene:    # Robust: the only setting that flattened an expressive cloned voice; slowed, since no v3 tag slows it
        {provider: elevenlabs, model_id: eleven_v3, voice_settings: {stability: 1.0}, effects: {tempo: 0.7},
         takes: {n: 2, targets: serene}}

targets:
  identical_frame_share: [0.45, 0.55]    # measured 0.49 (0.59 before the local-change rule, an#255)
  one_frame_interval_share: [0.87, 0.97] # measured 0.94 (0.91 before the local-change rule, an#255)
  cuts_per_min: [8, 10]                  # measured 9.0

# Delivery targets, checked by `python -m an.verify.prosody <audio>... --targets <this file> --role <role> --text "<words>"`
# (an.verify.prosody; spectrum level (c): a goal with a verifier). Each range is the 25th-75th
# percentile of that delivery class in two OverSimplified episodes (57 min, 899 sentences, a
# vocal stem; measured with an.verify.prosody's own estimators, so only comparable to clips it
# measures). The ranges are per SENTENCE: pass a role's lines as separate files and the
# median over the lines is checked (joining them would add the register changes between
# lines to the pitch spread). register_st needs --reference-hz: the voice's neutral median.
prosody_targets:
  narrator:          # sentences of 8+ words in the narrating register (n=374)
    articulation_rate_sps: [5.2, 6.3]
    f0_sd_st: [3.9, 5.2]
    f0_range_st: [12.5, 15.7]
    final_drop_st: [-3.4, 0.1]
    loudness_range_db: [20.5, 25.0]
    emphasis_per_s: [2.1, 3.2]
  punchline:         # short line after a beat of 0.4-1.1 s, flat and falling (n=10; the beat itself is the `(pause)` before the line)
    articulation_rate_sps: [3.1, 5.4]
    f0_sd_st: [2.2, 3.4]
    f0_range_st: [7.0, 10.3]
    final_drop_st: [-3.6, -1.7]
  eager:             # quoted figures pitched UP (register +5 to +11 st over the narrating voice; n=135)
    articulation_rate_sps: [3.6, 5.9]
    f0_sd_st: [1.9, 3.8]
    f0_range_st: [6.0, 11.9]
    final_drop_st: [-2.7, 0.7]
    register_st: [3.0, 11.0]          # over the voice's own neutral median; the source's +5 is over ANOTHER register, the low end allows for that
  regal:             # quoted figures pitched DOWN: pompous, commanding (register -4.6 to -6 st; n=110)
    articulation_rate_sps: [3.9, 5.6]
    f0_sd_st: [2.1, 4.1]
    f0_range_st: [6.1, 12.9]
    final_drop_st: [-1.4, 1.5]
  serene:            # the understatement class: slow, narrow, level (n=147); also the wounded-dignity line
    articulation_rate_sps: [3.0, 4.3]
    f0_sd_st: [1.9, 3.0]
    f0_range_st: [5.4, 9.1]
    final_drop_st: [-1.3, 1.2]
  deadpan:           # a character deadpan throughout: the punchline numbers
    f0_sd_st: [2.2, 3.4]
    f0_range_st: [7.0, 10.3]
    final_drop_st: [-3.6, -1.7]
  throwaway:         # fast, quieter aside (n=13)
    articulation_rate_sps: [6.5, 7.3]
    f0_sd_st: [3.0, 4.8]
    final_drop_st: [-3.7, -0.5]
  build:             # long setup that does not resolve: rising end (n=38)
    f0_sd_st: [4.6, 5.5]
    f0_range_st: [14.3, 16.7]
    final_drop_st: [1.2, 3.7]
  outburst:          # shouted line: register +3.8 to +11 st and +3.6 to +4.5 dB at the 90th percentile (n=19)
    register_st: [3.8, 11.0]

guidance:
  construction: blocky body, stick limbs, oversized head (all live as `characters` knobs); brows and mouth only, no nose or ears
  identity: costume colour, hat, hair and sash tell figures apart (live as `characters.palette`, `hat`, `hair_style`/`hair_length` and `sash`); beards, crowns and uniforms beyond a sash are not
  crowds: dozens of identical figures; no instancing macro ships, so repeat entities by hand
  structure: [narrated_map, dramatization, date_card]
  narration: one narrator voices every character, third person
  palette_accents: {brick: "#ba5f31", sage: "#67796a", card_bg: "#040404"}   # not StylePack roles
  maps: a plane environment (a depth-0 fill for the sea, depth-1 fill planes for land and territories) plus path props for routes and arrows drawn on with a `trim_end` tween and world text props for labels (the an skill's recipe builds one); a territory changing hands is a `tint` tween on a WHITE fill plane (colours cross-fade per channel); real coastlines need image planes or SVG prop art
  text: date cards (bold white sans on black, 1.5-2.5 s) are an overlay text prop over a black fill plane; top-of-frame bullet captions are overlay text anchored at `top`; small speech text is world text. Only the built-in regular face ships, so bold needs a bold font FILE in the text's `font`
  motion_vocabulary_unmapped: [fall, freeze_frame, bait_and_switch]   # no preset
  sound: the bed is `live.sound` (bring a licensed track; the originals are Kevin MacLeod, CC BY, attribution required); dense SFX are shot `sounds` cues you place by hand
  transitions: gag interrupts are an edit, not a transition; cut to them
  voice_acting:
    # A style of METHODS, not an imitation of a person: delivery (timing, pitch movement,
    # emphasis, pauses, register jumps) measured as numbers, applied to the production's own
    # voices. Never clone, imitate or speech-to-speech any reference voice.
    source: two OverSimplified episodes (57 min), private study; vocal stem by Demucs, words by Whisper, numbers by an.verify.prosody; no audio or transcript kept in any repository
    profile:
      narrator: fast and lively, not monotone - 5.8 syllables/s while speaking, pitch moving 4.5 st (sd) over a 14 st range inside one sentence, phrase ends falling 1.5 st, 2.6 stand-out peaks/s
      pauses: short - 0.18 s between words, 0.23 s at a comma, 0.32 s at a full stop (90th percentile 0.9 s); the comedic beat before a punchline is 0.4-1.1 s, about twice a full stop
      contrast: the rate changes 1-2 syllables/s from one sentence to the next (spread 24% of the mean); that contrast, more than any one sentence, is the style
      characters: 27% of sentences are quoted figures in another register (up +7 st or down -5 st), short (5 words) and steadier than the narration (pitch sd 2.8 st) - the jump is the joke, not the intonation inside the line
      questions: 14% of sentences are questions, often answered at once by a short flat line; 5% are exclamations; about 2 interjections a minute (oh, well, okay, yep, whoa)
      artifacts: no breaths or laughs found in the transcript (a weak test - the transcriber drops non-words); the quoted figures' interjections (whoa, oh no, ha ha) are performed as words
    devices:   # device -> how to write the line for eleven_v3; `targets` names a prosody_targets entry
      setup:            {share: 0.42, line: "{excited}, one CAPITALISED word per sentence, commas not ellipses (ellipses slowed v3 to 4.7 syll/s)", targets: narrator}
      punchline:        {share: 0.01, line: "its own dialogue line with a (pause 0.5-0.9) before it, {deadpan}, no CAPS (CAPS flattened the fall), a full stop", targets: punchline}
      quoted_figure:    {share: 0.27, line: "short lines (8 words or fewer; split a speech into several lines with (pause 0.15)), the role's tag: {excited} up, {matter-of-fact} down", targets: [eager, regal]}
      understatement:   {share: 0.16, line: "no tag, a full stop, CAPS on the one word that hurts (I was ON slide one.)", targets: serene}
      outburst:         {share: 0.02, line: "{shouting} and CAPS on the key word; measured +5 to +9 st over the voice's own median", targets: outburst}
      rhetorical_question: {share: 0.04, line: "a question line ({curious} optional; it rises by itself) then a (pause 0.3) and a short {deadpan} answer", targets: punchline}
      throwaway:        {share: 0.01, line: "{under his breath} or {under her breath} drops the register 2-4 st and the level; v3 will not speed it up, so speak it through a second voice document of the same voice with effects.tempo 1.3 (the line's voice_ref: Python or ir/scene.json, scene.md has no per-line voice)", targets: throwaway}
      build:            {share: 0.04, line: "a long list sentence; v3 did not rise at the end with an ellipsis or {dramatically} (measured -1.3 to 0); end on a question if the rise matters", targets: build}
    markup_rules:
      - One dialogue line per delivery. A tag applies to a whole line (it is sent as a prefix), so a setup and its punchline are two lines, never one.
      - The beat is a `(pause s)` on the punchline line, 0.5-0.9 s; between ordinary lines leave 0.15-0.35 s.
      - Narrator setups get {excited}; punchlines get {deadpan}; a figure's lines get its role tag; understatement gets nothing.
      - Cues are `{braces}`, never `[brackets]`, because `[emotion]` is the face preset vocabulary (an unknown one is a validate error), and it is sent as a tag as well, so `[happy] {excited}` speaks as `[happy] [excited]`. Leave the emotion off a line whose cue it would contradict, and move the face with an expression action instead.
      - CAPITALISE one stressed word per sentence for the stress it places, never on a punchline (it flattened the fall). Measured alone it did not move the pitch spread; {excited} is the lever (narrator spread 3.0 to 4.4-4.9 st). Ellipses plus dashes plus capitals also raised it to about 4 st, but slowed v3 to 4.7 syll/s.
      - Split a character's speech into lines of 8 words or fewer; OverSimplified's figures talk in bursts.
      - Prefer commas and full stops to ellipses in narration; use an ellipsis only where you want a slower, hanging phrase.
      - Do not stack emotive tags on an expressive cloned voice ({indignant}, {sighs, hurt}, {quietly} each threw a wounded line out to 2.5 syllables/s and 10-17 st of range); the plain line was on target.
      - Check each role with `python -m an.verify.prosody <line files>... --targets <this file> --role <role> --text "<line 1>" --text "<line 2>"` (one --text per file, in order; the median over the lines is compared). A take varies more than a setting does, so let `takes` re-roll a missing line (raise its role's `n`, or add the line's cue under `takes.cues`) before re-tagging.
    tempo:
      # eleven_v3 ignores `voice_settings.speed` (1.1 measured the same as 1.0) and no tag moved the rate
      # ({fast-paced}, {quickly}, {rapid-fire} all 4.6-5.3 syll/s), so the rate is set by `effects.tempo`
      # (stock ffmpeg atempo, pitch kept, applied before lip-sync so the mouth and captions follow it).
      rule: tempo = the role's target median rate / the cast voice's own plain rate (measure one plain line with an.verify.prosody); the role defaults assume v3's usual 4.9-5.4 syll/s
      measured: "narrator (ov) 4.94 -> 5.41 syll/s at 1.1; a voice that runs fast (vanessa, 6.55 plain) needed 0.6 for serene (3.78, every target met), where 0.8 left it at 5.07"
    takes:
      # A take varies more than any setting (the same punchline's final drop measured -0.8, -2.5 and +1.8 st in three takes),
      # so key lines are re-rolled: `takes` synthesizes n takes, scores each against its targets on the audio heard
      # (tempo included) and keeps the closest; the choice is recorded and a re-render reuses it.
      default: punchlines ({deadpan} under the narrator's takes.cues) 3 takes; eager (the most variable voice) 3; serene and a deadpan character 2; setups and regal 1
      cost: n requests per line on the first render (take 0 is the single take, so turning takes on for a synthesized line pays n-1); the render prints the requests and billed characters before the first one
      register: an eager role's register_st target needs the voice's neutral median pitch as `takes.reference_hz` on the voice document; without it that metric is unmeasured and weighs every take the same
    limits:
      - eleven_v3 ignores `voice_settings.speed`; `effects.tempo` is the rate lever (above), and it is per voice, not per line, so a line at another rate (a throwaway) needs a second voice document
      - a `seed` does not make eleven_v3 repeatable (identical requests returned different audio); a take is fixed by the audio cache and the takes record once kept, never by its seed
      - stability moved the measured pitch spread less than the difference between two seeds; tags and capitals are the levers, and takes pick among their results
