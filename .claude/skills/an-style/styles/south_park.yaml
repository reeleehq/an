# South Park-style cut-out (a digital emulation of construction-paper cut-out).
# Read with the an-style skill. `live` keys map onto shipped `an` features and are
# checked against the code by tests/test_style_specs.py; `targets` are what
# `an.verify.style` measures; `guidance` is NOT wired to anything in `an` today.
# Numbers: misc/docs/cutout_styles_research.md (one 30 s dialogue scene, measured).
style: south_park
title: South Park (construction-paper cut-out, digital)
cost_class: low
cost_note: rigid shape characters, a locked camera and flat sets; `an character new --offline --build squat --head-scale 1.3 --hat beanie` characters are close to the look

live:
  meta:                      # the ```yaml meta``` block
    fps: 24                  # 24p source
    default_easing: linear          # short snaps, never an overshoot; every unnamed tween takes it
    step_hz: 12              # on twos at 24 fps; body tweens hold every other frame
    style_pack: south_park
  style_pack:                # save as assets/styles/south_park.json; reaches environment presets, procedural rigs and factory characters' tagged colours; surface treatments reach every character and prop
    name: south_park
    roles:
      sky: "#c0c6c7"         # measured backdrop grey
      ground: "#987a43"      # measured ochre
    surface:                 # an#163: compile-time copies of each part, drawn behind it; widths in rig pixels (~frame pixels at a 1080p two-shot)
      outline: {width: 3, color: "#231316"}           # measured near-black, 8% dark pixels
      shadow: {dx: 3, dy: 3, color: "#000000", alpha: 0.35}   # the "no-platen" paper-gap shadow
    grain: {amount: 0.05, seed: 0}   # static paper grain over the frame; not measurable at 360p (research §3), so the amount is an estimate
  environment:
    preset: indoor           # flat set; `park` for exteriors
  camera:
    default: hold            # measured: median global shift 0.11 px, 3% of steps above 1 px
    allowed: [hold, push_in] # a push-in is rare, slow, 2 s or more
  easing: [linear, step]     # short 3-6 frame moves, never an overshoot ("intentionally jerky")
  tween_duration_s: [0.12, 0.25]
  motion_presets: [waddle, hop, nod, slide_in, slide_out, turn]   # an.motion; waddle walk, hop-turn, head snap, slides, turn (front/three_quarter/side/back swapped at the edge-on midpoint)
  shots:
    mean_s: 4.2              # measured, n=7
    range_s: [1.5, 9]
  characters:
    generate: offline        # `an character new <name> --offline`
    mouth_variants: [happy, sad]
    build: squat             # `--build squat`: a wide round body on short legs
    head_scale: 1.3          # `--head-scale 1.3`: the head is about as wide as the body
    hat: [beanie, cap, none] # `--hat`: pick one per character; a hat and a costume colour tell them apart
    sash: false
    palette: per_character   # `--palette clothing=#..,accessory=#..,leg=#..`: a distinct costume each
  transitions:
    default: {kind: cut}     # hard cuts only [research: U]
  voice:
    effects: {pitch_semitones: 4}   # the `effects` of every kid's voice document in assets/voices/ (an#163); about 4 semitones is an estimate

targets:
  identical_frame_share: [0.55, 0.70]   # measured 0.64
  cuts_per_min: [10, 14]                # measured 12.4
  mean_shot_s: [3, 5.5]                 # measured 4.2

guidance:                    # not in `an` yet: apply by hand where you can, otherwise tell the user it was omitted
  construction: head, torso and limbs are single rigid pieces; no elbow or knee bends (the squat build is live; the near-circular head with eyes touching is not)
  eyes: two white ovals with pupil dots; brows appear when worried or angry; a half-lid per shot
  views: the show turns a figure by a hard swap between front and three-quarter heads; a `turn` play with a `duration` near one frame is the closest, and the factory's three-quarter body is a stand-in for the show's head-only swap
  coverage: [two_shot, single_close, over_shoulder]
  motion_vocabulary_unmapped: [whole_piece_rotate]   # no preset: a short rotation tween on the entity
  voice: pitch raised; see `live.voice`. The amount is an estimate, and a stock-ffmpeg shift (asetrate + atempo) is a cruder shifter than a studio one
  sound: sparse stingers as shot `sounds` cues on the beat they punctuate, no music bed; `an` ships no sound library, so stingers are assets you add with their licence
  text: occasional location cards — an overlay text prop (a TextDescriptor on the overlay layer) over the set or a fill plane; the an skill's recipe builds one
