<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>an cutout runtime</title>
    <style>
        html, body { margin: 0; padding: 0; background: transparent; }
        /* The stage canvas MUST stay composited on the RENDER page, and this is
           the opposite of what an#57 assumed. The screenshot capture path
           (`--capture screenshot`; the canvas path is the default since an#192
           but shares this page) takes a Playwright ELEMENT screenshot, which
           Playwright implements as a PAGE
           capture clipped to the element's document rect
           (`screenshotter.js::screenshotElement`, pinned playwright==1.55.0):
             - it gates on `_waitAndScrollIntoViewIfNeeded(waitForVisible=true)`,
               so `display:none` / `visibility:hidden` /
               `content-visibility:hidden` block for the whole locator timeout
               and then raise TimeoutError; and
             - it reads pixels from the COMPOSITOR, so the two spellings
               Playwright does accept -- `opacity:0` and off-screen positioning --
               return an all-white frame (1 distinct RGBA value).
           Measured 2026-08-22 at 1920x1080. Hiding the canvas is only reachable
           together with an in-page capture path; see an#57 and
           .claude/skills/an-dev-render-pipeline/SKILL.md section 2. */
        #stage { display: block; }
    </style>
    <!-- PixiJS v7.4.2, vendored (global build, exposes window.PIXI).
         MIT — the notice ships beside it at vendor/pixi.LICENSE.txt, which the
         minified banner alone does not satisfy.
         Vendored, not fetched: a CDN fetch makes a cold render need the network
         and makes the shot cache unsound, since a third party could change the
         renderer without changing any cache key.
         Pinned by sha256 in tests/test_vendored_engine.py — replace both the
         file and the digest together. -->
    <script src="vendor/pixi.min.js"></script>
    <script src="runtime.js"></script>
    <!-- Genres' runtime code (an#247): their visual kinds, registered with
         window.anRegisterVisual. Shipped empty; the stage rewrites the staged
         copy from the registered genres' scripts. -->
    <script src="extensions.js"></script>
</head>
<body>
    <canvas id="stage"></canvas>
</body>
</html>
